<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --bg: #ffffff; --fg: #111; --sub: #555; --muted: #999; --line: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262626; --fg: #f5f5f5; --sub: #c8c8c8; --muted: #8e8e8e; --line: rgba(255,255,255,.08); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%;
    font-family: "Malgun Gothic", "Segoe UI", sans-serif; user-select: none; }
  .card {
    position: absolute; inset: 10px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 2px 7px rgba(0,0,0,.16);
    display: flex; gap: 12px; align-items: center; padding: 12px 14px;
    cursor: pointer;
    animation: in .22s ease-out;
  }
  .card.out { animation: out .2s ease-in forwards; }
  @keyframes in  { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes out { to { transform: translateX(30px); opacity: 0; } }
  .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%; padding: 2px;
    background: linear-gradient(45deg, #feda75, #d62976, #833ab4);
  }
  .avatar > * {
    width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg);
    object-fit: cover; display: grid; place-items: center;
    background: #ddd; color: #fff; font-weight: 700; font-size: 17px;
  }
  .avatar .initial { background: linear-gradient(45deg, #d62976, #833ab4); }
  .text { min-width: 0; flex: 1; }
  .top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
  .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app { flex: none; font-size: 11px; color: var(--muted); }
  .body {
    font-size: 13px; line-height: 1.35; color: var(--sub);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-all;
  }
  .close {
    position: absolute; top: 6px; right: 8px; width: 20px; height: 20px; border: 0;
    background: none; color: var(--muted); font-size: 15px; cursor: pointer; opacity: 0;
    transition: opacity .15s;
  }
  .card:hover .close { opacity: 1; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="avatar" id="avatar"></div>
  <div class="text">
    <div class="top"><span class="name" id="name"></span><span class="app">Instagram · 지금</span></div>
    <div class="body" id="body"></div>
  </div>
  <button class="close" id="close" title="닫기">✕</button>
</div>
<script>
  const data = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
  const card = document.getElementById('card');
  document.getElementById('name').textContent = data.title || 'Instagram';
  document.getElementById('body').textContent = data.body || '';

  const avatar = document.getElementById('avatar');
  const initial = () => {
    const d = document.createElement('div');
    d.className = 'initial';
    d.textContent = (data.title || 'I').trim().charAt(0).toUpperCase();
    avatar.replaceChildren(d);
  };
  if (data.icon) {
    const img = document.createElement('img');
    img.src = data.icon;
    img.onerror = initial;
    avatar.appendChild(img);
  } else initial();

  // 알림음 (짧은 두 음)
  if (data.sound) {
    try {
      const ac = new AudioContext();
      [[880, 0], [1320, 0.11]].forEach(([f, t]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.16);
        o.connect(g).connect(ac.destination);
        o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.18);
      });
    } catch {}
  }

  // 5초 뒤 자동으로 사라짐 (마우스를 올리면 멈춤)
  let timer;
  const dismiss = (fn) => { card.classList.add('out'); setTimeout(fn, 200); };
  const arm = () => { timer = setTimeout(() => dismiss(window.popup.close), 5000); };
  card.addEventListener('mouseenter', () => clearTimeout(timer));
  card.addEventListener('mouseleave', arm);
  arm();

  card.addEventListener('click', () => window.popup.click());
  document.getElementById('close').addEventListener('click', (e) => {
    e.stopPropagation();
    dismiss(window.popup.close);
  });
</script>
</body>
</html>
